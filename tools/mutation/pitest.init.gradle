// Mutation testing setup, applied only with:
//   ./gradlew pitest -I tools/mutation/pitest.init.gradle
// The normal build (build, test) never loads this file.

initscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.15.0'
    }
}

allprojects { Project p ->
    p.apply plugin: info.solidsoft.gradle.pitest.PitestPlugin

    p.extensions.configure(info.solidsoft.gradle.pitest.PitestPluginExtension) { ext ->
        ext.pitestVersion = '1.15.0'
        ext.junit5PluginVersion = '1.2.1'
        ext.threads = 2
        ext.timeoutFactor = 1.25
        ext.timeoutConstant = 4000
        ext.outputFormats = ['HTML', 'XML']
        ext.timestampedReports = false
        ext.verbose = false
        // Pure logic only: formatting, config, layout and color helpers.
        ext.targetClasses = [
            'dev.effecttimer.format.*',
            'dev.effecttimer.config.*',
            'dev.effecttimer.layout.*'
        ]
        ext.targetTests = ['dev.effecttimer.*']
    }

    p.afterEvaluate { Project q ->
        def clientSet = q.extensions.findByName('sourceSets') ? q.sourceSets.findByName('client') : null
        if (clientSet == null) {
            return
        }
        def ext = q.extensions.getByType(info.solidsoft.gradle.pitest.PitestPluginExtension)
        def extra = clientSet.output.classesDirs
        def current = ext.mutableCodePaths
        if (current instanceof org.gradle.api.file.ConfigurableFileCollection) {
            current.from(extra)
        } else {
            ext.mutableCodePaths = q.files(current, extra)
        }
    }
}
