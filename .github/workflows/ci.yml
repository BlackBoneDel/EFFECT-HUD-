name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run tests and build the mod jar
        run: ./gradlew test jar --no-daemon

      - name: Count executed tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              suite = ET.parse(path).getroot()
              total += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0))
              skipped += int(suite.get('skipped', 0))
          print(f'::notice title=Tests::Tests executed: {total} (failures={failures}, errors={errors}, skipped={skipped})')
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Upload temporary mod JAR (30 days)
        uses: actions/upload-artifact@v4
        with:
          name: effect-hud-pr2-build
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          retention-days: 30
          if-no-files-found: error

  mutation:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run PIT
        run: |
          set +e
          ./gradlew pitest -I tools/mutation/pitest.init.gradle --no-daemon > pit.log 2>&1
          code=$?
          set -e
          python3 - <<'PY'
          import re
          text = open('pit.log', encoding='utf-8', errors='replace').read()
          idx = text.find('What went wrong')
          snippet = text[idx:idx + 1500] if idx >= 0 else text[-1500:]
          print('::error title=PIT failure::' + snippet.replace('\n', '%0A').replace('\r', ''))
          PY
          exit $code

      - name: Summarize mutation results per package
        if: always()
        run: |
          python3 - <<'PY'
          import collections, glob, xml.etree.ElementTree as ET
          files = glob.glob('build/reports/pitest/**/mutations.xml', recursive=True)
          if not files:
              print('::notice title=PIT::no mutations.xml found')
          for path in files:
              stats = collections.defaultdict(lambda: collections.Counter())
              for m in ET.parse(path).getroot().iter('mutation'):
                  cls = m.findtext('mutatedClass') or ''
                  pkg = cls.rsplit('.', 1)[0] if '.' in cls else cls
                  status = m.get('status', 'UNKNOWN')
                  stats[pkg]['total'] += 1
                  stats[pkg][status] += 1
              total = collections.Counter()
              for pkg in sorted(stats):
                  c = stats[pkg]
                  total.update(c)
                  killed = c['KILLED']
                  score = 100.0 * killed / c['total'] if c['total'] else 0.0
                  line = (f"{pkg}: score={score:.1f}% total={c['total']} killed={killed} "
                          f"survived={c['SURVIVED']} no_coverage={c['NO_COVERAGE']} timed_out={c['TIMED_OUT']}")
                  print(line)
                  print(f"::notice title=PIT {pkg}::{line}")
              t = total['total']
              overall = 100.0 * total['KILLED'] / t if t else 0.0
              print(f"OVERALL: score={overall:.1f}% total={t} killed={total['KILLED']} survived={total['SURVIVED']}")
              print(f"::notice title=PIT overall::score={overall:.1f}% total={t} killed={total['KILLED']} survived={total['SURVIVED']}")
          PY

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest
          if-no-files-found: warn
