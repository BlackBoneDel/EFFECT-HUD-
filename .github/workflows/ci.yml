name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run tests and build
        run: ./gradlew test build --no-daemon

      - name: Count executed tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              suite = ET.parse(path).getroot()
              total += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0))
              skipped += int(suite.get('skipped', 0))
          print(f'::notice title=Tests::Tests executed: {total} (failures={failures}, errors={errors}, skipped={skipped})')
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/potion-effect-*.jar
          if-no-files-found: error

  parity:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Check out the v1.2.0 tag for the reference build
        uses: actions/checkout@v5
        with:
          ref: v1.2.0
          path: reference

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build the v1.2.0 tag in this environment
        working-directory: reference
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Download the mod jar built from main in this run
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: built

      - name: Download the published v1.2.0 jar (informative)
        continue-on-error: true
        run: |
          curl -fsSL -o published.jar \
            https://github.com/BlackBoneDel/EFFECT-HUD-/releases/download/v1.2.0/potion-effect-1.2.0.jar

      - name: Compare jars
        run: |
          python3 - <<'PY'
          import glob, hashlib, os, subprocess, tempfile, zipfile, difflib

          def jar_of(pattern):
              hits = [p for p in glob.glob(pattern) if not p.endswith(('-sources.jar', '-dev.jar'))]
              return hits[0] if hits else None

          def extract(jar):
              d = tempfile.mkdtemp()
              zipfile.ZipFile(jar).extractall(d)
              return d

          def notice(title, msg):
              print(f'::notice title={title}::{msg}')

          def javap(path):
              return subprocess.run(['javap', '-c', '-p', '-constants', path],
                                    capture_output=True, text=True, check=True).stdout

          def sha(path):
              with open(path, 'rb') as f:
                  return hashlib.sha256(f.read()).hexdigest()

          def compare(label, a_jar, b_jar):
              a_dir, b_dir = extract(a_jar), extract(b_jar)
              a_names = set(zipfile.ZipFile(a_jar).namelist())
              b_names = set(zipfile.ZipFile(b_jar).namelist())
              entries_ok = a_names == b_names
              only_a = sorted(a_names - b_names)
              only_b = sorted(b_names - a_names)
              mod_json_ok = open(os.path.join(a_dir, 'fabric.mod.json'), 'rb').read() == \
                  open(os.path.join(b_dir, 'fabric.mod.json'), 'rb').read()

              classes = sorted(n for n in a_names | b_names if n.endswith('.class'))
              class_diffs, samples = [], []
              for c in classes:
                  pa, pb = os.path.join(a_dir, c), os.path.join(b_dir, c)
                  if not (os.path.exists(pa) and os.path.exists(pb)):
                      class_diffs.append(c + ' (missing on one side)')
                      continue
                  ja, jb = javap(pa), javap(pb)
                  if ja != jb:
                      class_diffs.append(c)
                      if len(samples) < 3:
                          d = list(difflib.unified_diff(ja.splitlines(), jb.splitlines(), lineterm='', n=0))
                          samples.append(c + ': ' + ' | '.join(d[2:8]))

              nonclass = sorted(n for n in a_names | b_names
                                if not n.endswith('.class') and not n.endswith('/'))
              nonclass_diffs = []
              for n in nonclass:
                  pa, pb = os.path.join(a_dir, n), os.path.join(b_dir, n)
                  if not (os.path.exists(pa) and os.path.exists(pb)) or sha(pa) != sha(pb):
                      nonclass_diffs.append(n)

              print(f'== {label} ==')
              print(f'entries identical: {entries_ok}; only in reference: {only_a}; only in built: {only_b}')
              print(f'fabric.mod.json identical: {mod_json_ok}')
              print(f'{len(class_diffs)} clases con diferencias de bytecode: {class_diffs}')
              for smp in samples:
                  print('  sample ' + smp[:600])
              print(f'{len(nonclass_diffs)} archivos no-class distintos: {nonclass_diffs}')
              notice(f'Parity {label}', f'entries={entries_ok} mod_json={mod_json_ok} '
                     f'classes_diff={len(class_diffs)} nonclass_diff={len(nonclass_diffs)}')
              notice(f'Parity {label} classes', f'{len(class_diffs)} clases con diferencias de bytecode: '
                     + ' '.join(class_diffs)[:3000])
              notice(f'Parity {label} nonclass', f'{len(nonclass_diffs)} archivos no-class distintos: '
                     + ' '.join(nonclass_diffs)[:3000])
              for smp in samples:
                  notice(f'Parity {label} sample', smp[:900])

          built = jar_of('built/potion-effect-*.jar')
          reference = jar_of('reference/build/libs/potion-effect-*.jar')
          print('built:', built, 'reference:', reference)
          compare('reference-rebuild', reference, built)
          if os.path.exists('published.jar'):
              compare('published-v1.2.0', 'published.jar', built)
          PY

  mutation:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run PIT
        run: ./gradlew pitest -I tools/mutation/pitest.init.gradle --no-daemon

      - name: Summarize mutation results per package
        if: always()
        run: |
          python3 - <<'PY'
          import collections, glob, xml.etree.ElementTree as ET
          files = glob.glob('build/reports/pitest/**/mutations.xml', recursive=True)
          if not files:
              print('::notice title=PIT::no mutations.xml found')
          for path in files:
              stats = collections.defaultdict(lambda: collections.Counter())
              for m in ET.parse(path).getroot().iter('mutation'):
                  cls = m.findtext('mutatedClass') or ''
                  pkg = cls.rsplit('.', 1)[0] if '.' in cls else cls
                  status = m.get('status', 'UNKNOWN')
                  stats[pkg]['total'] += 1
                  stats[pkg][status] += 1
              total = collections.Counter()
              for pkg in sorted(stats):
                  c = stats[pkg]
                  total.update(c)
                  killed = c['KILLED']
                  score = 100.0 * killed / c['total'] if c['total'] else 0.0
                  line = (f"{pkg}: score={score:.1f}% total={c['total']} killed={killed} "
                          f"survived={c['SURVIVED']} no_coverage={c['NO_COVERAGE']} timed_out={c['TIMED_OUT']}")
                  print(line)
                  print(f"::notice title=PIT {pkg}::{line}")
              t = total['total']
              overall = 100.0 * total['KILLED'] / t if t else 0.0
              print(f"OVERALL: score={overall:.1f}% total={t} killed={total['KILLED']} survived={total['SURVIVED']}")
              print(f"::notice title=PIT overall::score={overall:.1f}% total={t} killed={total['KILLED']} survived={total['SURVIVED']}")
          PY

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest
          if-no-files-found: warn
